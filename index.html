<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イントロどん！</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background: #f0f2f5; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
    input, button { font-size: 18px; padding: 12px; margin: 8px 0; width: 80%; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
    button { cursor: pointer; background: #007bff; color: white; border: none; font-weight: bold; }
    button:disabled { background: #ccc; }
    
    /* アイコン表示スタイル */
    .icon-preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin: 10px auto; display: block; border: 2px solid #ddd; }
    .score-icon { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; vertical-align: middle; margin-right: 10px; }
    .winner-icon { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin: 10px auto; border: 4px solid #ff4757; }

    /* 早押しボタンのデザイン */
    .buzzer-btn {
      width: 200px; height: 200px; border-radius: 50%; font-size: 28px; background: #ff4757;
      color: white; border: 8px solid #ff6b81; box-shadow: 0 8px 0 #2ed573; margin: 20px auto; display: block;
    }
    .buzzer-btn:active { box-shadow: none; transform: translateY(8px); }
    .buzzer-btn:disabled { background: #a4b0be; border-color: #ced6e0; }

    /* ホスト画面用スタイル */
    .host-ctrl { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
    .btn-correct { background: #2ed573; }
    .btn-wrong { background: #ffa502; }
    .btn-reset { background: #ff4757; }
    ul { list-style: none; padding: 0; }
    li { background: #f1f2f6; margin: 5px 0; padding: 10px; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; }
    .player-info { display: flex; align-items: center; }
  </style>
</head>
<body>

<div class="card">
  <!-- ロール選択 -->
  <div id="role-select">
    <h2>モードを選択</h2>
    <button onclick="selectRole('player')">プレイヤー（スマホ）</button>
    <button onclick="selectRole('host')" style="background:#2f3542;">ホスト（管理画面）</button>
  </div>

  <!-- プレイヤー用画面 -->
  <div id="player-ui" style="display:none;">
    <div id="join-form">
      <h3>エントリー</h3>
      <input type="text" id="player-name" placeholder="ニックネーム">
      <div style="margin: 10px 0;">
        <label style="font-size:14px; color:#666;">アイコン画像を選択：</label><br>
        <input type="file" id="player-icon-input" accept="image/*" onchange="previewImage(event)">
        <img id="icon-preview" class="icon-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ccc'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='40' fill='%23fff'>👤</text></svg>">
      </div>
      <button onclick="joinGame()">参加する</button>
    </div>
    <div id="buzzer-area" style="display:none;">
      <h2 id="player-status">準備完了！</h2>
      <button id="buzzer-btn" class="buzzer-btn" onclick="pushBuzzer()" disabled>押す！</button>
    </div>
  </div>

  <!-- ホスト用画面 -->
  <div id="host-ui" style="display:none;">
    <h2>👑 ホスト管理画面</h2>
    
    <div id="winner-area">
      <img id="winner-icon" class="winner-icon" style="display:none;">
      <h1 id="winner-display" style="color:#ff4757; min-height: 40px; margin: 10px 0;">- 早押し受付中 -</h1>
    </div>

    <div class="host-ctrl">
      <button class="btn-reset" onclick="resetBuzzer()">早押し解禁</button>
      <button class="btn-correct" onclick="judge(true)">正解 (+1pt)</button>
      <button class="btn-wrong" onclick="judge(false)">不正解</button>
    </div>
    <h3>参加者スコアボード</h3>
    <ul id="score-list"></ul>
  </div>
</div>

<!-- Firebase SDK (v9 互換モード) -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
  // ★ ご自身のDatabase URLになっているか確認してください
  const firebaseConfig = {
    databaseURL: "https://intro-don-f34f7-default-rtdb.firebaseio.com"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let myName = "";
  let base64Image = "";

  // デフォルトの人間アイコンSVG
  const defaultIcon = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ccc'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='40' fill='%23fff'>👤</text></svg>";
  base64Image = defaultIcon;

  window.addEventListener('DOMContentLoaded', () => {
    if (location.hash === '#player') selectRole('player');
  });

  function selectRole(role) {
    document.getElementById('role-select').style.display = 'none';
    if (role === 'player') {
      document.getElementById('player-ui').style.display = 'block';
    } else {
      document.getElementById('host-ui').style.display = 'block';
      initHost();
    }
  }

  // 画像が選択されたらBase64に変換＆リサイズして軽量化
  function previewImage(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        // データの肥大化を防ぐために200x200pxに圧縮
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 200;
        canvas.height = 200;
        ctx.drawImage(img, 0, 0, 200, 200);
        base64Image = canvas.toDataURL('image/jpeg', 0.7);
        document.getElementById('icon-preview').src = base64Image;
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // --- プレイヤー処理 ---
  function joinGame() {
    myName = document.getElementById('player-name').value.trim();
    if (!myName) return alert("名前を入力してください");
    
    // スコア＆画像を送信
    db.ref('players/' + myName).set({
      score: 0,
      icon: base64Image
    });

    document.getElementById('join-form').style.display = 'none';
    document.getElementById('buzzer-area').style.display = 'block';
    listenState();
  }

  function pushBuzzer() {
    db.ref('currentAnswerer').transaction((current) => {
      if (current === null) {
        return { name: myName, icon: base64Image };
      }
      return;
    });
  }

  function listenState() {
    db.ref('currentAnswerer').on('value', (snapshot) => {
      const winnerData = snapshot.val();
      const btn = document.getElementById('buzzer-btn');
      const status = document.getElementById('player-status');

      if (!winnerData) {
        btn.disabled = false;
        status.innerText = "ボタンを押せ！";
        status.style.color = "#2ed573";
      } else {
        btn.disabled = true;
        if (winnerData.name === myName) {
          status.innerText = "🎉 あなたが最速です！解答してください！";
          status.style.color = "#ff4757";
        } else {
          status.innerText = `${winnerData.name} さんが押しました！`;
          status.style.color = "#747d8c";
        }
      }
    });
  }

  // --- ホスト処理 ---
  function initHost() {
    db.ref('currentAnswerer').on('value', (snapshot) => {
      const winnerData = snapshot.val();
      const display = document.getElementById('winner-display');
      const iconImg = document.getElementById('winner-icon');

      if (winnerData) {
        display.innerText = `🔔 ${winnerData.name} さん！`;
        iconImg.src = winnerData.icon || defaultIcon;
        iconImg.style.display = 'block';
      } else {
        display.innerText = "- 早押し受付中 -";
        iconImg.style.display = 'none';
      }
    });

    db.ref('players').on('value', (snapshot) => {
      const players = snapshot.val() || {};
      const list = document.getElementById('score-list');
      list.innerHTML = "";
      Object.keys(players).forEach(name => {
        const p = players[name];
        const li = document.createElement('li');
        li.innerHTML = `
          <div class="player-info">
            <img class="score-icon" src="${p.icon || defaultIcon}">
            <span>${name}</span>
          </div>
          <strong>${p.score || 0} pt</strong>
        `;
        list.appendChild(li);
      });
    });
  }

  function resetBuzzer() {
    db.ref('currentAnswerer').set(null);
  }

  function judge(isCorrect) {
    db.ref('currentAnswerer').once('value', (snapshot) => {
      const winnerData = snapshot.val();
      if (!winnerData) return;

      if (isCorrect) {
        db.ref(`players/${winnerData.name}/score`).transaction(s => (s || 0) + 1);
      }
      resetBuzzer();
    });
  }
</script>

</body>
</html>
