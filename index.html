
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>イントロどん！</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;background:#eef1f5;color:#202633;
      padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    .card{max-width:760px;margin:0 auto;background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 28px rgba(0,0,0,.09)}
    h1,h2,h3{margin:6px 0 12px}
    p{margin:8px 0}
    input,button{font:inherit}
    input[type="text"],input:not([type]),input[type="file"]{
      width:100%;padding:13px 14px;border:1px solid #d9dee7;border-radius:11px;background:#fff;
    }
    input[type="file"]{padding:10px}
    button{
      width:100%;min-height:48px;margin:5px 0;padding:11px 14px;border:0;border-radius:11px;
      background:#2563eb;color:#fff;font-weight:800;cursor:pointer;touch-action:manipulation;
    }
    button:disabled{background:#cbd2dc;color:#fff;cursor:not-allowed}
    .secondary{background:#64748b}.green{background:#16a34a}.orange{background:#f59e0b}
    .red{background:#ef4444}.dark{background:#111827}
    .hidden{display:none!important}
    .small{font-size:13px;color:#667085}
    .muted{color:#667085}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
    .badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#eef2f7;font-size:13px;font-weight:800;white-space:nowrap}
    .join-code{font-size:38px;letter-spacing:7px;font-weight:900;text-align:center;padding:15px;background:#f1f5f9;border-radius:14px}
    .notice{padding:11px 13px;border-radius:11px;background:#fff7df;color:#72520b}
    .status{padding:14px;border-radius:12px;background:#f1f5f9;text-align:center;font-weight:800;margin:10px 0}
    .winner-box{text-align:center;background:#fff5f5;border:2px solid #fecaca;border-radius:16px;padding:16px;margin:14px 0}
    .winner-name{font-size:30px;font-weight:900;color:#ef4444;min-height:38px}
    .winner-icon{width:112px;height:112px;border-radius:50%;object-fit:cover;border:4px solid #ef4444;margin:4px auto 8px;display:block}
    .answer{background:#f8fafc;border-radius:12px;padding:12px;margin:10px 0}
    .host-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .host-controls .wide{grid-column:1/-1}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .score-list{list-style:none;padding:0;margin:8px 0}
    .score-list li{
      background:#f1f5f9;margin:6px 0;padding:10px 12px;border-radius:11px;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
    }
    .player-info{display:flex;align-items:center;min-width:0}
    .player-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rank{width:30px;font-weight:900}
    .score-icon{width:42px;height:42px;border-radius:50%;object-fit:cover;margin-right:10px}
    .icon-preview{width:90px;height:90px;border-radius:50%;object-fit:cover;display:block;margin:10px auto;border:3px solid #ddd}
    .buzzer-btn{
      width:min(70vw,300px);height:min(70vw,300px);border-radius:50%;font-size:34px;
      background:#ef4444;color:#fff;border:10px solid #fb7185;
      box-shadow:0 10px 0 #16a34a;margin:24px auto;display:block;
    }
    .buzzer-btn:active:not(:disabled){box-shadow:none;transform:translateY(10px)}
    .question-list{max-height:250px;overflow:auto;border:1px solid #e5e7eb;border-radius:11px;padding:5px;margin-top:8px}
    .question-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px;border-bottom:1px solid #e5e7eb}
    .question-row:last-child{border-bottom:0}
    .question-row button{width:auto;min-height:36px;padding:7px 10px;font-size:13px;margin:0}
    .divider{border:0;border-top:1px solid #e5e7eb;margin:20px 0}
    .center{text-align:center}
    .role-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .connection{font-size:12px}
    .connection.ok{color:#16a34a}.connection.ng{color:#ef4444}
    .finished{background:#e2e8f0;color:#334155}
    @media(max-width:520px){
      body{padding:max(7px,env(safe-area-inset-top)) max(7px,env(safe-area-inset-right)) max(7px,env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left))}
      .card{padding:14px;border-radius:16px}
      .host-controls,.grid2,.role-buttons{grid-template-columns:1fr}
      .winner-name{font-size:25px}.join-code{font-size:32px}
    }
  </style>
</head>
<body>
<div class="card">

  <section id="role-select">
    <h1>🎵 イントロどん！</h1>
    <p class="small">早押し・得点管理アプリ</p>
    <div class="role-buttons">
      <button id="host-role-btn" class="dark" onclick="selectRole('host')">👑 ホスト</button>
      <button onclick="selectRole('player')">📱 参加者</button>
    </div>
    <button id="resume-host-btn" class="secondary hidden" onclick="showHostResume()">ホストとしてゲームを再開</button>
  </section>

  <section id="game-form" class="hidden">
    <h2>📱 ゲームに参加</h2>
    <input id="game-code-input" maxlength="8" placeholder="ゲームID（例：A7K3）" autocomplete="off" autocapitalize="characters">
    <button onclick="continueWithGame()">次へ</button>
    <button onclick="backToRoleSelect()" class="secondary">戻る</button>
  </section>

  <section id="host-resume-form" class="hidden">
    <h2>👑 ホストとして再開</h2>
    <p class="small">以前のゲームIDを入力してください。</p>
    <input id="host-resume-code" maxlength="8" placeholder="ゲームID（例：A7K3）" autocomplete="off" autocapitalize="characters">
    <button onclick="resumeHost()">再開する</button>
    <button onclick="backToRoleSelect()" class="secondary">戻る</button>
  </section>

  <section id="player-ui" class="hidden">
    <div id="join-form">
      <div class="topbar">
        <h2>📱 参加者</h2>
        <span id="player-game-badge" class="badge"></span>
      </div>
      <input id="player-name" type="text" maxlength="20" placeholder="ニックネーム" autocomplete="off">
      <div class="center" style="margin:12px 0">
        <label class="small">アイコン画像（任意）</label>
        <input type="file" id="player-icon-input" accept="image/*" onchange="previewImage(event)">
        <img id="icon-preview" class="icon-preview" alt="アイコン">
      </div>
      <button onclick="joinGame()">参加する</button>
    </div>

    <div id="buzzer-area" class="hidden">
      <div class="topbar">
        <strong id="player-display-name"></strong>
        <span id="player-score" class="badge">0 pt</span>
      </div>
      <div id="player-status" class="status">ホストの開始を待っています</div>
      <button id="buzzer-btn" class="buzzer-btn" onclick="pushBuzzer()" disabled>押す！</button>
      <button onclick="leaveGame()" class="secondary">退出</button>
    </div>
  </section>

  <section id="host-ui" class="hidden">
    <div class="topbar">
      <h2>👑 ホスト</h2>
      <div>
        <span id="host-game-badge" class="badge"></span>
        <span id="connection-status" class="connection ok">接続中</span>
      </div>
    </div>

    <div class="join-code" id="host-game-code"></div>
    <p class="small center">このゲームIDを参加者に共有してください</p>

    <div class="answer">
      <strong>🎵 現在の曲</strong>
      <input id="song-title" type="text" maxlength="100" placeholder="曲名を入力（参加者には表示しません）">
    </div>

    <div class="winner-box">
      <img id="winner-icon" class="winner-icon hidden" alt="回答者">
      <div id="winner-display" class="winner-name">-</div>
      <div id="winner-state" class="small">早押し受付停止中</div>
    </div>

    <div class="host-controls">
      <button class="green wide" id="start-buzzer-btn" onclick="startBuzzer()">🔔 早押し開始</button>
      <button class="green" onclick="judge(true)">⭕ 正解 +1</button>
      <button class="orange" onclick="judge(false)">❌ 不正解</button>
    </div>

    <div class="grid2">
      <button class="secondary" onclick="clearCurrentAnswerer()">回答者を取り消す</button>
      <button class="red" onclick="finishGame()">🏁 ゲーム終了</button>
    </div>

    <hr class="divider">
    <h3>📊 スコアボード <span id="host-player-count" class="small"></span></h3>
    <ul id="score-list" class="score-list"></ul>

    <hr class="divider">
    <h3>🎵 問題履歴</h3>
    <button class="secondary" onclick="saveCurrentQuestion()">現在の曲を問題履歴に保存</button>
    <div id="question-list" class="question-list"></div>

    <div class="notice" style="margin-top:12px">
      ※ 曲の再生・停止はホスト側の音楽プレイヤーで行ってください。
    </div>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  databaseURL: "https://intro-don-f34f7-default-rtdb.firebaseio.com"
};

let db = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
} catch(err) {
  console.error("Firebase初期化エラー:", err);
}

// 通信が返ってこない時に無限に待たないためのタイムアウト
function withTimeout(promise, ms = 8000) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms))
  ]);
}

function explainError(err) {
  const msg = (err && err.message) ? err.message : String(err);
  if(msg === "timeout") {
    return "サーバーから応答がありません。\nネット接続と、Firebaseの databaseURL を確認してください。";
  }
  if(/permission[_ ]denied/i.test(msg)) {
    return "Firebaseのルールで拒否されました。\nRealtime Database の「ルール」を確認してください。\n（テストモードは30日で期限切れになります）";
  }
  return msg;
}

function dbReady() {
  if(db) return true;
  alert("Firebaseを読み込めませんでした。\nネット接続を確認して、ページを再読み込みしてください。");
  return false;
}

let gameId = "";
let myId = "";
let myName = "";
let base64Image = "";
let listeners = [];
let isHost = false;
let gameFinished = false; // ゲーム終了後に画面表示が上書きされるのを防ぐ
let judging = false;      // 正解/不正解ボタンの連打による二重加点を防ぐ
let joining = false;      // 「参加する」連打による二重登録を防ぐ

const defaultIcon =
  "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23cbd5e1'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='40' fill='%23fff'>👤</text></svg>";

base64Image = defaultIcon;

function gameRef(path="") {
  return db.ref("games/" + gameId + (path ? "/" + path : ""));
}

function makeId() {
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-6);
}

function makeGameCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for(let i=0;i<4;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}

function clearListeners() {
  listeners.forEach(x => x.ref.off(x.event, x.cb));
  listeners = [];
}

function watch(ref, event, cb) {
  ref.on(event, cb);
  listeners.push({ref, event, cb});
}

function showOnly(id) {
  ["role-select","game-form","host-resume-form","player-ui","host-ui"].forEach(x => {
    document.getElementById(x).classList.add("hidden");
  });
  if(id) document.getElementById(id).classList.remove("hidden");
}

function selectRole(role) {
  if(role === "host") {
    createGame();
  } else {
    showOnly("game-form");
  }
}

function backToRoleSelect() {
  clearListeners();
  showOnly("role-select");
}

function showHostResume() {
  document.getElementById("host-resume-code").value = localStorage.getItem("introDonHostGame") || "";
  showOnly("host-resume-form");
}

let creating = false;
async function createGame() {
  if(creating || !dbReady()) return;
  creating = true;
  const btn = document.getElementById("host-role-btn");
  btn.disabled = true;
  btn.innerText = "作成中…";

  try {
    clearListeners();
    isHost = true;
    gameFinished = false;

    let code = "";
    for(let i=0;i<10;i++){
      const candidate = makeGameCode();
      const snap = await withTimeout(db.ref("games/" + candidate).once("value"));
      if(!snap.exists()){ code = candidate; break; }
    }
    if(!code) throw new Error("ゲームIDを作成できませんでした。もう一度お試しください。");

    gameId = code;
    await withTimeout(gameRef().set({
      code: gameId,
      status: "waiting",
      createdAt: firebase.database.ServerValue.TIMESTAMP,
      buzzer: { open:false, winner:null }
    }));

    localStorage.setItem("introDonHostGame", gameId);
    showOnly("host-ui");
    document.getElementById("host-game-code").innerText = gameId;
    document.getElementById("host-game-badge").innerText = "ID " + gameId;
    initHost();
  } catch(err) {
    console.error(err);
    isHost = false;
    alert("ゲームを作成できませんでした。\n" + explainError(err));
  } finally {
    creating = false;
    btn.disabled = false;
    btn.innerText = "👑 ホスト";
  }
}

async function resumeHost() {
  if(!dbReady()) return;
  const code = document.getElementById("host-resume-code").value.trim().toUpperCase();
  if(!code) return alert("ゲームIDを入力してください");

  try {
    const snap = await withTimeout(db.ref("games/" + code).once("value"));
    if(!snap.exists()) return alert("そのゲームIDは見つかりません");

    gameId = code;
    isHost = true;
    gameFinished = false;
    localStorage.setItem("introDonHostGame", gameId);
    showOnly("host-ui");
    document.getElementById("host-game-code").innerText = gameId;
    document.getElementById("host-game-badge").innerText = "ID " + gameId;
    initHost();
  } catch(err) {
    console.error(err);
    alert("再開できませんでした。\n" + explainError(err));
  }
}

async function continueWithGame() {
  if(!dbReady()) return;
  const code = document.getElementById("game-code-input").value.trim().toUpperCase();
  if(!code) return alert("ゲームIDを入力してください");

  try {
    const snap = await withTimeout(db.ref("games/" + code).once("value"));
    if(!snap.exists()) return alert("そのゲームIDは見つかりません");
    if(snap.val().status === "finished") return alert("このゲームは終了しています");

    gameId = code;
    isHost = false;
    gameFinished = false;
    showOnly("player-ui");
    document.getElementById("player-game-badge").innerText = "ID " + gameId;
  } catch(err) {
    console.error(err);
    alert("ゲームに接続できませんでした。\n" + explainError(err));
  }
}

function previewImage(event) {
  const file = event.target.files[0];
  if(!file) return;
  if(file.size > 8 * 1024 * 1024) return alert("画像は8MB以下にしてください");

  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = 200; canvas.height = 200;
      const ctx = canvas.getContext("2d");
      const size = Math.min(img.width, img.height);
      const sx = (img.width-size)/2, sy = (img.height-size)/2;
      ctx.drawImage(img,sx,sy,size,size,0,0,200,200);
      base64Image = canvas.toDataURL("image/jpeg",0.72);
      document.getElementById("icon-preview").src = base64Image;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function joinGame() {
  if(joining) return;
  myName = document.getElementById("player-name").value.trim();
  if(!myName) return alert("名前を入力してください");
  if(!gameId) return alert("ゲームIDがありません");

  joining = true;
  myId = makeId();
  const playerRef = gameRef("players/" + myId);

  playerRef.set({
    name: myName,
    score: 0,
    icon: base64Image,
    joinedAt: firebase.database.ServerValue.TIMESTAMP
  }).then(() => {
    // 通信が切れたら自動的に参加者を削除
    playerRef.onDisconnect().remove();

    document.getElementById("join-form").classList.add("hidden");
    document.getElementById("buzzer-area").classList.remove("hidden");
    document.getElementById("player-display-name").innerText = myName;
    listenPlayer();
  }).catch(err => {
    joining = false;
    alert("参加できませんでした: " + err.message);
  });
}

function pushBuzzer() {
  if(!myId || !gameId) return;

  // 「受付中」かつ「まだ回答者なし」を同一トランザクションで判定。
  // 30〜50人が同時に押しても、Firebase側で1人だけがwinnerになります。
  gameRef("buzzer").transaction(state => {
    state = state || {open:false, winner:null};
    if(state.open && !state.winner) {
      state.winner = {
        id: myId,
        name: myName,
        icon: base64Image,
        pushedAt: firebase.database.ServerValue.TIMESTAMP
      };
    }
    return state;
  });
}

function listenPlayer() {
  clearListeners();

  watch(gameRef("buzzer"), "value", snap => {
    const buzzer = snap.val() || {open:false,winner:null};
    const btn = document.getElementById("buzzer-btn");
    const status = document.getElementById("player-status");

    if(gameFinished) { btn.disabled = true; return; }

    if(buzzer.winner) {
      btn.disabled = true;
      if(buzzer.winner.id === myId) {
        status.innerText = "🎉 あなたが最速です！";
        status.style.color = "#ef4444";
      } else {
        status.innerText = buzzer.winner.name + " さんが押しました！";
        status.style.color = "#667085";
      }
      return;
    }

    if(buzzer.open) {
      btn.disabled = false;
      status.innerText = "🔥 押せ！";
      status.style.color = "#16a34a";
    } else {
      btn.disabled = true;
      status.innerText = "ホストの開始を待っています";
      status.style.color = "#667085";
    }
  });

  watch(gameRef("status"), "value", snap => {
    if(snap.val() === "finished") {
      gameFinished = true;
      document.getElementById("buzzer-btn").disabled = true;
      const status = document.getElementById("player-status");
      status.innerText = "🏁 ゲーム終了";
      status.style.color = "";
      status.classList.add("finished");
    }
  });

  watch(gameRef("players/" + myId + "/score"), "value", snap => {
    document.getElementById("player-score").innerText = (snap.val() || 0) + " pt";
  });
}

function startBuzzer() {
  gameRef("status").set("playing");
  gameRef("buzzer").set({open:true,winner:null});
}

function clearCurrentAnswerer() {
  gameRef("buzzer/winner").set(null).then(() => {
    gameRef("buzzer/open").set(false);
  });
}

async function judge(isCorrect) {
  if(judging) return; // 連打で二重に加点されるのを防ぐ
  judging = true;
  try {
    const snap = await gameRef("buzzer").once("value");
    const buzzer = snap.val() || {};
    const winner = buzzer.winner;

    if(!winner) return alert("まだ回答者が決まっていません");

    // 先に受付を閉じる
    await gameRef("buzzer/open").set(false);

    // 退出済みの参加者に加点して「名無し」が復活しないよう、存在確認してから加点
    if(isCorrect && winner.id) {
      const exists = (await gameRef("players/" + winner.id).once("value")).exists();
      if(exists) {
        await gameRef("players/" + winner.id + "/score").transaction(score => (score || 0) + 1);
      }
    }

    await gameRef("buzzer/winner").set(null);
  } catch(err) {
    alert("判定に失敗しました: " + err.message);
  } finally {
    judging = false;
  }
}

async function saveCurrentQuestion() {
  const title = document.getElementById("song-title").value.trim();
  if(!title) return alert("曲名を入力してください");

  const snap = await gameRef("questions").once("value");
  const qs = snap.val() || {};
  const numbers = Object.values(qs).map(q => Number(q.number) || 0);
  const number = numbers.length ? Math.max(...numbers) + 1 : 1;

  await gameRef("questions").push({
    number,
    title,
    savedAt: firebase.database.ServerValue.TIMESTAMP
  });

  alert("第" + number + "問として保存しました");
}

function deleteQuestion(id) {
  if(confirm("この問題履歴を削除しますか？")) {
    gameRef("questions/" + id).remove();
  }
}

function finishGame() {
  if(!confirm("ゲームを終了しますか？")) return;

  gameRef("status").set("finished");
  gameRef("buzzer").set({open:false,winner:null});
  alert("ゲームを終了しました");
}

function leaveGame() {
  clearListeners();
  const done = () => location.reload();
  if(myId && gameId) {
    // 削除が完了する前にリロードして消えないよう、完了を待つ
    gameRef("players/" + myId).remove().then(done, done);
  } else {
    done();
  }
}

function initHost() {
  clearListeners();

  // .info/connected はルート直下の特殊パス（games/XXXX/ の下に付けるとエラーになる）
  watch(db.ref(".info/connected"), "value", snap => {
    const el = document.getElementById("connection-status");
    if(snap.val() === true) {
      el.innerText = "● 接続中";
      el.className = "connection ok";
    } else {
      el.innerText = "● 接続待ち";
      el.className = "connection ng";
    }
  });

  watch(gameRef("buzzer"), "value", snap => {
    const buzzer = snap.val() || {open:false,winner:null};
    const winner = buzzer.winner;
    const display = document.getElementById("winner-display");
    const icon = document.getElementById("winner-icon");
    const state = document.getElementById("winner-state");
    const startBtn = document.getElementById("start-buzzer-btn");

    if(gameFinished) {
      display.innerText = "-";
      icon.classList.add("hidden");
      state.innerText = "ゲーム終了";
      state.style.color = "#667085";
      startBtn.innerText = "🏁 ゲーム終了";
      startBtn.disabled = true;
      return;
    }

    if(winner) {
      display.innerText = "🔔 " + winner.name + " さん";
      icon.src = winner.icon || defaultIcon;
      icon.classList.remove("hidden");
      state.innerText = "回答権を獲得しました";
      state.style.color = "#ef4444";
    } else {
      display.innerText = buzzer.open ? "早押し受付中" : "-";
      icon.classList.add("hidden");
      state.innerText = buzzer.open ? "回答者が決まるまで受付中" : "早押し受付停止中";
      state.style.color = buzzer.open ? "#16a34a" : "#667085";
    }

    startBtn.innerText = buzzer.open ? "🔴 早押し受付中" : "🔔 早押し開始";
    startBtn.disabled = buzzer.open;
  });

  watch(gameRef("status"), "value", snap => {
    if(snap.val() === "finished") {
      gameFinished = true;
      document.getElementById("start-buzzer-btn").disabled = true;
      document.getElementById("start-buzzer-btn").innerText = "🏁 ゲーム終了";
      document.getElementById("winner-state").innerText = "ゲーム終了";
      document.getElementById("winner-state").style.color = "#667085";
    }
  });

  watch(gameRef("players"), "value", snap => {
    const players = snap.val() || {};
    const arr = Object.entries(players)
      .map(([id,p]) => ({id,...p}))
      .sort((a,b) => (Number(b.score)||0) - (Number(a.score)||0));

    document.getElementById("host-player-count").innerText = "(" + arr.length + "人)";
    const list = document.getElementById("score-list");
    list.innerHTML = "";

    arr.forEach((p,i) => {
      const li = document.createElement("li");
      li.innerHTML = `
        <div class="player-info">
          <span class="rank">${i+1}</span>
          <img class="score-icon" src="${escapeHtml(p.icon || defaultIcon)}" alt="">
          <span class="player-name">${escapeHtml(p.name || "名無し")}</span>
        </div>
        <strong>${Number(p.score)||0} pt</strong>`;
      list.appendChild(li);
    });
  });

  watch(gameRef("questions"), "value", snap => {
    const qs = snap.val() || {};
    const list = document.getElementById("question-list");
    list.innerHTML = "";

    Object.entries(qs)
      .sort((a,b) => (Number(a[1].number)||0) - (Number(b[1].number)||0))
      .forEach(([id,q]) => {
        const row = document.createElement("div");
        row.className = "question-row";
        row.innerHTML = `
          <span>第${Number(q.number)||0}問：${escapeHtml(q.title || "曲名未入力")}</span>
          <button class="red" onclick="deleteQuestion('${escapeHtml(id)}')">削除</button>`;
        list.appendChild(row);
      });
  });
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

// 初期表示
document.getElementById("icon-preview").src = defaultIcon;
if(localStorage.getItem("introDonHostGame")) {
  document.getElementById("resume-host-btn").classList.remove("hidden");
}
</script>
</body>
</html>
