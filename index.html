<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イントロどん！</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0; padding: 16px; background: #f0f2f5; color: #2f3542;
    }
    .card {
      background: white; padding: 20px; border-radius: 16px;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
      max-width: 720px; margin: 0 auto;
    }
    h1,h2,h3 { margin-top: 8px; }
    input, button {
      font-size: 17px; padding: 12px; margin: 6px 0;
      border-radius: 10px; border: 1px solid #dfe4ea; width: 100%;
    }
    input { background:#fff; }
    button {
      cursor: pointer; background: #007bff; color: white; border: none;
      font-weight: bold; min-height: 48px;
    }
    button:disabled { background: #c8cdd3; cursor: not-allowed; }
    .secondary { background:#57606f; }
    .green { background:#2ed573; }
    .orange { background:#ffa502; }
    .red { background:#ff4757; }
    .dark { background:#2f3542; }
    .small { font-size: 13px; color:#747d8c; }
    .hidden { display:none !important; }

    .topbar {
      display:flex; justify-content:space-between; align-items:center;
      gap:10px; margin-bottom:12px;
    }
    .badge {
      display:inline-block; padding:6px 10px; border-radius:999px;
      background:#f1f2f6; font-size:13px; font-weight:bold;
    }

    .icon-preview {
      width:90px; height:90px; border-radius:50%; object-fit:cover;
      display:block; margin:10px auto; border:3px solid #ddd;
    }
    .score-icon {
      width:42px; height:42px; border-radius:50%; object-fit:cover;
      vertical-align:middle; margin-right:10px;
    }
    .winner-icon {
      width:120px; height:120px; border-radius:50%; object-fit:cover;
      margin:8px auto; border:4px solid #ff4757;
    }

    .buzzer-btn {
      width: min(65vw, 280px); height: min(65vw, 280px);
      border-radius:50%; font-size:32px; background:#ff4757;
      color:white; border:10px solid #ff6b81;
      box-shadow:0 10px 0 #2ed573; margin:24px auto; display:block;
    }
    .buzzer-btn:active:not(:disabled) {
      box-shadow:none; transform:translateY(10px);
    }

    .status {
      padding:14px; border-radius:12px; background:#f1f2f6;
      text-align:center; font-weight:bold; margin:10px 0;
    }
    .winner-box {
      text-align:center; background:#fff4f4; border:2px solid #ff6b81;
      border-radius:16px; padding:16px; margin:14px 0;
    }
    .winner-name { font-size:30px; font-weight:800; color:#ff4757; }
    .answer {
      background:#f8f9fa; border-radius:12px; padding:12px;
      margin:10px 0; font-size:16px;
    }
    .host-controls {
      display:grid; grid-template-columns:1fr 1fr; gap:8px;
    }
    .host-controls .wide { grid-column:1 / -1; }

    .score-list { list-style:none; padding:0; margin:8px 0; }
    .score-list li {
      background:#f1f2f6; margin:6px 0; padding:10px 12px;
      border-radius:10px; display:flex; align-items:center;
      justify-content:space-between; gap:10px;
    }
    .player-info { display:flex; align-items:center; min-width:0; }
    .player-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .rank { width:30px; font-weight:800; }

    .question-list {
      max-height:240px; overflow:auto; border:1px solid #eee;
      border-radius:10px; padding:6px; margin-top:8px;
    }
    .question-row {
      display:flex; align-items:center; justify-content:space-between;
      gap:8px; padding:8px; border-bottom:1px solid #eee;
    }
    .question-row:last-child { border-bottom:0; }
    .question-row button { width:auto; min-height:36px; padding:7px 10px; font-size:13px; margin:0; }

    .join-code {
      font-size:34px; letter-spacing:6px; font-weight:900;
      text-align:center; padding:12px; background:#f1f2f6; border-radius:12px;
    }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .player-count { font-weight:bold; }
    .notice { padding:10px; border-radius:10px; background:#fff8e1; color:#795548; }
    @media (max-width: 520px) {
      body { padding:8px; }
      .card { padding:14px; }
      .grid2, .host-controls { grid-template-columns:1fr; }
      .winner-name { font-size:26px; }
    }
  </style>
</head>
<body>

<div class="card">
  <!-- モード選択 -->
  <div id="role-select">
    <h1>🎵 イントロどん！</h1>
    <p class="small">早押し・得点管理アプリ</p>
    <button onclick="selectRole('host')" class="dark">👑 ホスト（管理画面）</button>
    <button onclick="selectRole('player')">📱 プレイヤー（スマホ）</button>
  </div>

  <!-- 共通：ゲームID -->
  <div id="game-form" class="hidden">
    <h2 id="game-form-title">ゲームに参加</h2>
    <input id="game-code-input" maxlength="8" placeholder="ゲームID（例：A7K3）" autocomplete="off">
    <button onclick="continueWithGame()">次へ</button>
    <button onclick="backToRoleSelect()" class="secondary">戻る</button>
  </div>

  <!-- プレイヤー -->
  <div id="player-ui" class="hidden">
    <div id="join-form">
      <div class="topbar">
        <h2>📱 プレイヤー</h2>
        <span id="player-game-badge" class="badge"></span>
      </div>
      <input type="text" id="player-name" maxlength="20" placeholder="ニックネーム" autocomplete="off">
      <div style="margin:10px 0;text-align:center;">
        <label class="small">アイコン画像（任意）</label>
        <input type="file" id="player-icon-input" accept="image/*" onchange="previewImage(event)">
        <img id="icon-preview" class="icon-preview">
      </div>
      <button onclick="joinGame()">参加する</button>
    </div>

    <div id="buzzer-area" class="hidden">
      <div class="topbar">
        <strong id="player-display-name"></strong>
        <span id="player-score" class="badge">0 pt</span>
      </div>
      <div id="player-status" class="status">ホストの開始を待っています</div>
      <button id="buzzer-btn" class="buzzer-btn" onclick="pushBuzzer()" disabled>押す！</button>
      <button onclick="leaveGame()" class="secondary">退出</button>
    </div>
  </div>

  <!-- ホスト -->
  <div id="host-ui" class="hidden">
    <div class="topbar">
      <h2>👑 ホスト</h2>
      <span id="host-game-badge" class="badge"></span>
    </div>

    <div class="join-code" id="host-game-code"></div>
    <p class="small" style="text-align:center;">このゲームIDを参加者に共有してください</p>

    <div class="answer">
      <strong>現在の曲</strong>
      <input id="song-title" placeholder="曲名を入力（参加者には表示しません）">
    </div>

    <div class="winner-box">
      <img id="winner-icon" class="winner-icon hidden">
      <div id="winner-display" class="winner-name">- 早押し受付中 -</div>
      <div id="winner-state" class="small">受付停止中</div>
    </div>

    <div class="host-controls">
      <button class="green wide" id="start-buzzer-btn" onclick="resetBuzzer()">🔔 早押し開始</button>
      <button class="green" onclick="judge(true)">⭕ 正解 +1</button>
      <button class="orange" onclick="judge(false)">❌ 不正解</button>
    </div>

    <div class="grid2">
      <button class="secondary" onclick="clearCurrentAnswerer()">回答者を取り消す</button>
      <button class="red" onclick="finishGame()">🏁 ゲーム終了</button>
    </div>

    <hr>
    <h3>📊 スコアボード <span id="host-player-count" class="small"></span></h3>
    <ul id="score-list" class="score-list"></ul>

    <hr>
    <h3>🎵 問題履歴</h3>
    <button class="secondary" onclick="saveCurrentQuestion()">現在の曲を問題履歴に保存</button>
    <div id="question-list" class="question-list"></div>

    <div class="notice" style="margin-top:12px;">
      ※ 曲の再生・停止は手元の音楽プレイヤーで行ってください。
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  databaseURL: "https://intro-don-f34f7-default-rtdb.firebaseio.com"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let gameId = "";
let myId = "";
let myName = "";
let base64Image = "";
let listeners = [];
let hostGameCode = "";

const defaultIcon =
  "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ccc'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='40' fill='%23fff'>👤</text></svg>";

base64Image = defaultIcon;

function gameRef(path="") {
  return db.ref("games/" + gameId + (path ? "/" + path : ""));
}

function makeId() {
  return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
}

function makeGameCode() {
  return Math.random().toString(36).substring(2, 6).toUpperCase();
}

function clearListeners() {
  listeners.forEach(x => x.ref.off(x.event, x.cb));
  listeners = [];
}

function watch(ref, event, cb) {
  ref.on(event, cb);
  listeners.push({ref, event, cb});
}

function selectRole(role) {
  document.getElementById("role-select").classList.add("hidden");
  if (role === "host") {
    createGame();
  } else {
    document.getElementById("game-form").classList.remove("hidden");
    document.getElementById("game-form-title").innerText = "ゲームに参加";
  }
}

function backToRoleSelect() {
  document.getElementById("game-form").classList.add("hidden");
  document.getElementById("role-select").classList.remove("hidden");
}

async function createGame() {
  hostGameCode = makeGameCode();
  gameId = hostGameCode;
  await gameRef().set({
    code: hostGameCode,
    status: "waiting",
    buzzerOpen: false,
    currentAnswerer: null,
    createdAt: firebase.database.ServerValue.TIMESTAMP
  });
  document.getElementById("host-ui").classList.remove("hidden");
  document.getElementById("host-game-code").innerText = hostGameCode;
  document.getElementById("host-game-badge").innerText = "ID " + hostGameCode;
  initHost();
}

async function continueWithGame() {
  const code = document.getElementById("game-code-input").value.trim().toUpperCase();
  if (!code) return alert("ゲームIDを入力してください");
  const snap = await db.ref("games/" + code).once("value");
  if (!snap.exists()) return alert("そのゲームIDは見つかりません");
  gameId = code;
  document.getElementById("game-form").classList.add("hidden");
  document.getElementById("player-ui").classList.remove("hidden");
  document.getElementById("player-game-badge").innerText = "ID " + gameId;
}

function previewImage(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) return alert("画像は8MB以下にしてください");

  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = 200; canvas.height = 200;
      const ctx = canvas.getContext("2d");
      const size = Math.min(img.width, img.height);
      const sx = (img.width - size) / 2;
      const sy = (img.height - size) / 2;
      ctx.drawImage(img, sx, sy, size, size, 0, 0, 200, 200);
      base64Image = canvas.toDataURL("image/jpeg", 0.7);
      document.getElementById("icon-preview").src = base64Image;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function joinGame() {
  myName = document.getElementById("player-name").value.trim();
  if (!myName) return alert("名前を入力してください");
  if (!gameId) return alert("ゲームIDがありません");

  myId = makeId();
  const playerRef = gameRef("players/" + myId);

  playerRef.set({
    name: myName,
    score: 0,
    icon: base64Image,
    joinedAt: firebase.database.ServerValue.TIMESTAMP
  }).then(() => {
    document.getElementById("join-form").classList.add("hidden");
    document.getElementById("buzzer-area").classList.remove("hidden");
    document.getElementById("player-display-name").innerText = myName;
    listenPlayer();
  });
}

function pushBuzzer() {
  if (!myId) return;
  gameRef("currentAnswerer").transaction(current => {
    if (current === null) {
      return {
        id: myId,
        name: myName,
        icon: base64Image,
        pushedAt: firebase.database.ServerValue.TIMESTAMP
      };
    }
    return;
  });
}

function listenPlayer() {
  clearListeners();

  watch(gameRef("currentAnswerer"), "value", snap => {
    const winner = snap.val();
    const btn = document.getElementById("buzzer-btn");
    const status = document.getElementById("player-status");

    if (!winner) {
      watchGameStateOnce();
      return;
    }

    btn.disabled = true;
    if (winner.id === myId) {
      status.innerText = "🎉 あなたが最速です！";
      status.style.color = "#ff4757";
    } else {
      status.innerText = winner.name + " さんが押しました！";
      status.style.color = "#747d8c";
    }
  });

  watch(gameRef("buzzerOpen"), "value", snap => {
    const open = !!snap.val();
    const winner = null;
    document.getElementById("buzzer-btn").disabled = !open;
    if (open) {
      document.getElementById("player-status").innerText = "🔥 押せ！";
      document.getElementById("player-status").style.color = "#2ed573";
    }
  });

  watch(gameRef("players/" + myId + "/score"), "value", snap => {
    document.getElementById("player-score").innerText = (snap.val() || 0) + " pt";
  });
}

function watchGameStateOnce() {
  gameRef("buzzerOpen").once("value");
}

function initHost() {
  clearListeners();

  watch(gameRef("currentAnswerer"), "value", snap => {
    const winner = snap.val();
    const display = document.getElementById("winner-display");
    const icon = document.getElementById("winner-icon");
    const state = document.getElementById("winner-state");

    if (winner) {
      display.innerText = "🔔 " + winner.name + " さん";
      icon.src = winner.icon || defaultIcon;
      icon.classList.remove("hidden");
      state.innerText = "回答権を獲得しました";
      state.style.color = "#ff4757";
    } else {
      display.innerText = "- 早押し受付中 -";
      icon.classList.add("hidden");
    }
  });

  watch(gameRef("buzzerOpen"), "value", snap => {
    const open = !!snap.val();
    document.getElementById("start-buzzer-btn").innerText =
      open ? "🔴 早押し受付中" : "🔔 早押し開始";
    document.getElementById("winner-state").innerText =
      open ? "回答者が決まるまで受付中" : "受付停止中";
  });

  watch(gameRef("players"), "value", snap => {
    const players = snap.val() || {};
    const arr = Object.entries(players)
      .map(([id,p]) => ({id, ...p}))
      .sort((a,b) => (b.score || 0) - (a.score || 0));

    document.getElementById("host-player-count").innerText = "(" + arr.length + "人)";
    const list = document.getElementById("score-list");
    list.innerHTML = "";

    arr.forEach((p, i) => {
      const li = document.createElement("li");
      li.innerHTML = `
        <div class="player-info">
          <span class="rank">${i+1}</span>
          <img class="score-icon" src="${p.icon || defaultIcon}">
          <span class="player-name">${escapeHtml(p.name || "名無し")}</span>
        </div>
        <strong>${p.score || 0} pt</strong>`;
      list.appendChild(li);
    });
  });

  watch(gameRef("questions"), "value", snap => {
    const qs = snap.val() || {};
    const list = document.getElementById("question-list");
    list.innerHTML = "";
    Object.entries(qs).sort((a,b) => (a[1].number||0)-(b[1].number||0)).forEach(([id,q]) => {
      const row = document.createElement("div");
      row.className = "question-row";
      row.innerHTML = `<span>第${q.number}問：${escapeHtml(q.title || "曲名未入力")}</span>
                       <button class="red" onclick="deleteQuestion('${id}')">削除</button>`;
      list.appendChild(row);
    });
  });
}

function resetBuzzer() {
  gameRef("currentAnswerer").set(null).then(() => {
    gameRef("buzzerOpen").set(true);
  });
}

function clearCurrentAnswerer() {
  gameRef("currentAnswerer").set(null);
}

function judge(isCorrect) {
  gameRef("currentAnswerer").once("value", snap => {
    const winner = snap.val();
    if (!winner) return alert("まだ回答者が決まっていません");

    if (isCorrect && winner.id) {
      gameRef("players/" + winner.id + "/score")
        .transaction(score => (score || 0) + 1);
    }
    gameRef("buzzerOpen").set(false);
    gameRef("currentAnswerer").set(null);
  });
}

async function saveCurrentQuestion() {
  const title = document.getElementById("song-title").value.trim();
  if (!title) return alert("曲名を入力してください");

  const snap = await gameRef("questions").once("value");
  const qs = snap.val() || {};
  const number = Object.keys(qs).length + 1;
  await gameRef("questions").push({
    number, title,
    savedAt: firebase.database.ServerValue.TIMESTAMP
  });
  alert("第" + number + "問として保存しました");
}

function deleteQuestion(id) {
  if (confirm("この問題履歴を削除しますか？")) {
    gameRef("questions/" + id).remove();
  }
}

function finishGame() {
  if (!confirm("ゲームを終了しますか？")) return;
  gameRef("status").set("finished");
  gameRef("buzzerOpen").set(false);
  gameRef("currentAnswerer").set(null);
  alert("ゲームを終了しました");
}

function leaveGame() {
  if (myId) gameRef("players/" + myId).remove();
  clearListeners();
  location.reload();
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

document.getElementById("icon-preview").src = defaultIcon;

if (location.hash === "#player") {
  selectRole("player");
}
</script>
</body>
</html>
